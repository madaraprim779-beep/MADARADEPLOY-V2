<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard — MadaraDeploy</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .dashboard {
      width: min(1100px, 92%);
      margin: 50px auto;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
    }

    .dashboard-header h1 {
      font-size: 38px;
      letter-spacing: -1px;
    }

    .dashboard-header p {
      margin-top: 8px;
      color: #8491a7;
    }

    .github-button {
      border: 0;
      cursor: pointer;
      padding: 14px 20px;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      background: #171717;
      border: 1px solid #ffffff18;
    }

    .github-button:hover {
      background: #242424;
    }

    .github-status {
      display: none;
      margin-bottom: 25px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #22c55e33;
      background: #22c55e0d;
      color: #86efac;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr
