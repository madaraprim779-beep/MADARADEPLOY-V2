<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MadaraDeploy</title>
  <meta
    name="description"
    content="Déploie tes projets directement depuis GitHub avec MadaraDeploy."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">
      <span class="logo-mark">M</span>
      <span>Madara<span class="accent">Deploy</span></span>
    </div>

    <a href="dashboard.html" class="nav-button">
      Dashboard
    </a>
  </header>

  <main class="hero">

    <div class="badge">
      ⚡ GitHub → Deploy
    </div>

    <h1>
      Déploie ton site.
      <span>Simplement.</span>
    </h1>

    <p class="description">
      Connecte ton projet GitHub, sélectionne ton dépôt
      et lance ton premier déploiement en quelques secondes.
    </p>

    <div class="actions">
      <a href="dashboard.html" class="primary-button">
        🚀 Commencer
      </a>

      <a href="dashboard.html" class="secondary-button">
        Voir le dashboard
      </a>
    </div>

    <div class="preview-card">

      <div class="window-bar">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="deploy-content">

        <div class="deploy-icon">
          🚀
        </div>

        <div>
          <strong>MadaraDeploy</strong>
          <p>Prêt pour le déploiement</p>
        </div>

        <div class="status">
          ● Ready
        </div>

      </div>

    </div>

  </main>

  <footer>
    <p>© 2026 MadaraDeploy — GitHub → Deploy</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
